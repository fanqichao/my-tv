plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fanqichao.mytv'
    compileSdk 34

    viewBinding {
        enabled = true
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.fanqichao.mytv"
        minSdk 21
        targetSdk 33
        // CI 通过 -PVERSION_NAME / -PVERSION_CODE 注入自动递增的版本号；
        // 本地构建没有传参时回退到 git tag 或 version.json
        versionCode(project.findProperty('VERSION_CODE')?.toString()?.toInteger() ?: VersionCode())
        versionName(project.findProperty('VERSION_NAME')?.toString() ?: VersionName())

        // 构建信息编进 BuildConfig，方便确认手上这个包是哪次构建出来的
        buildConfigField "String", "BUILD_TIME", "\"${BuildTime()}\""
        buildConfigField "String", "GIT_SHA", "\"${GitSha()}\""

        // This block is different from the one you use to link Gradle
        // to your CMake or ndk-build script.
        externalNativeBuild {

            // For ndk-build, instead use the ndkBuild block.
            cmake {
                arguments "-DIS_SO_BUILD=${project.hasProperty('IS_SO_BUILD') ? project.IS_SO_BUILD : true}"

                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }

        // Similar to other properties in the defaultConfig block,
        // you can configure the ndk block for each product flavor
        // in your build configuration.
        ndk {
            // Specifies the ABI configurations of your native
            // libraries Gradle should build and package with your app.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = 17
    }

    // Encapsulates your external native build configurations.
    externalNativeBuild {

        // Encapsulates your CMake build configurations.
        cmake {

            // Provides a relative path to your CMake build script.
            path = file("CMakeLists.txt")
        }
    }
}

// 构建时间与提交号：写进 BuildConfig，出问题时能直接确认是哪个包
static def BuildTime() {
    return new Date().format("yyyy-MM-dd HH:mm:ss")
}

static def GitSha() {
    try {
        def p = "git rev-parse --short HEAD".execute()
        p.waitFor()
        def sha = p.text.trim()
        if (sha) {
            return sha
        }
    } catch (ignored) {
    }
    return "unknown"
}

static def VersionCode() {
    def code = 0
    try {
        def p = "git describe --tags --always".execute()
        p.waitFor()
        def replace = [v: "", ".": " ", "-": " "]
        def arr = (p.text.trim().replace(replace) + " 0").split(" ")
        code = arr[0].toInteger() * 16777216 + arr[1].toInteger() * 65536 + arr[2].toInteger() * 256 + arr[3].toInteger()
    } catch (ignored) {
    }
    if (code <= 0) {
        // 无 git 标签时回退读取根目录 version.json
        try {
            def json = new groovy.json.JsonSlurper().parse(new File("version.json"))
            code = (json.version_code as Integer) ?: 0
        } catch (ignored) {
        }
    }
    if (code <= 0) {
        code = 1
    }
    println("VersionCode $code")
    return code
}

static def VersionName() {
    try {
        def p = "git describe --tags --always".execute()
        p.waitFor()
        def name = p.text.trim() - "v"
        // 只有形如 2.1.0 / 2.1.0-3-gabc 的标签才算版本号；
        // 仓库没有标签时 git 返回的是提交哈希（如 3f74499），不能当版本号用
        if (name && (name ==~ /^\d+(\.\d+)+.*$/)) {
            return name
        }
    } catch (ignored) {
    }
    // 无 git 标签时回退读取根目录 version.json
    try {
        def json = new groovy.json.JsonSlurper().parse(new File("version.json"))
        if (json.version_name) {
            return json.version_name.toString() - "v"
        }
    } catch (ignored) {
    }
    return "1.0.0"
}

dependencies {
    def media3_version = "1.3.1"

    implementation "androidx.media3:media3-ui:$media3_version"

    // For media playback using ExoPlayer
    implementation "androidx.media3:media3-exoplayer:$media3_version"

    // For HLS playback support with ExoPlayer
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"

    // 21:2.11.0 17:2.6.4
    def retrofit2_version = "2.11.0"

    implementation 'com.google.protobuf:protobuf-kotlin:3.25.1'
    implementation "com.squareup.retrofit2:converter-gson:$retrofit2_version"
    implementation "com.squareup.retrofit2:converter-protobuf:$retrofit2_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit2_version"

    implementation 'androidx.leanback:leanback:1.2.0-alpha04'
    
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'androidx.core:core-ktx:1.13.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0-RC")

    implementation 'com.google.android.exoplayer:exoplayer-ui:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.13.3'
}