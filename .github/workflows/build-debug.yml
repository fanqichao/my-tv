name: build-debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 版本号自动迭代：v1.0.<递增序号>
      # BASE_RUN 是「对应 v1.0.0 的那次运行号」，本仓库首次启用时为 8，
      # 之后每次构建 PATCH 自动 +1，无需手动改 version.json
      - name: Compute version
        id: ver
        run: |
          BASE_RUN=8
          PATCH=$(( GITHUB_RUN_NUMBER - BASE_RUN ))
          if [ "$PATCH" -lt 0 ]; then PATCH=0; fi
          VERSION_NAME="1.0.${PATCH}"
          VERSION_CODE=$(( 10000 + GITHUB_RUN_NUMBER ))
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "### 构建版本 v${VERSION_NAME} (versionCode ${VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"
          echo "- 运行号：#${GITHUB_RUN_NUMBER}（基准 #${BASE_RUN} = v1.0.0）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交：${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run build with Gradle wrapper
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug -PIS_SO_BUILD=false \
            -PVERSION_NAME=${{ steps.ver.outputs.name }} \
            -PVERSION_CODE=${{ steps.ver.outputs.code }} \
            --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -A 25 "What went wrong" gradle-build.log | head -40 | tr '\n' '~' | tr -d '\r' | cut -c1-3500)
            if [ -z "$msg" ]; then
              msg=$(tail -40 gradle-build.log | tr '\n' '~' | tr -d '\r' | cut -c1-3500)
            fi
            echo "::error title=GradleError::$msg"
            exit "$status"
          fi

      # 产物带版本号，避免每次下载下来都叫 app-debug.apk 分不清新旧
      - name: Rename APK with version
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/my-tv-v${{ steps.ver.outputs.name }}-debug.apk"
          {
            echo "versionName: ${{ steps.ver.outputs.name }}"
            echo "versionCode: ${{ steps.ver.outputs.code }}"
            echo "commit: ${GITHUB_SHA}"
            echo "run: #${GITHUB_RUN_NUMBER}"
            echo "builtAt: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > dist/build-info.txt
          cat dist/build-info.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      # 构建成功后自动发布 Release：tag = 版本号，说明取自本次提交信息
      # （提交时把修复内容写在 commit message 里即可；tag 已存在则改为补充上传）
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          APK="dist/my-tv-v${VER}-debug.apk"
          BODY=$(git log -1 --pretty=format:'%B')
          NOTES=$(printf '## 本次更新\n\n%s\n\n---\n- 版本：v%s（versionCode %s）\n- 提交：%s\n- 构建：run #%s\n- 安装：下载 my-tv-v%s-debug.apk；若提示签名不一致，请先卸载旧版本\n' "$BODY" "$VER" "$CODE" "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER" "$VER")
          if ! gh release create "v$VER" "$APK" dist/build-info.txt \
              --title "my-tv v$VER" --notes "$NOTES" 2>err.txt; then
            cat err.txt
            if grep -q "already_exists" err.txt; then
              gh release upload "v$VER" "$APK" dist/build-info.txt --clobber
            else
              exit 1
            fi
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-v${{ steps.ver.outputs.name }}-debug
          path: dist/*
